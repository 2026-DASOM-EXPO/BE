spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  error:
    whitelabel:
      enabled: false

app:
  sensor:
    fsr-worn-threshold: ${FSR_WORN_THRESHOLD:1000}
  drone:
    streaming:
      enabled: ${DRONE_STREAM_ENABLED:true}
      ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
      source-url-template: ${DRONE_RTSP_URL_TEMPLATE:rtsp://192.168.144.25:8554/main.264}
      output-directory: ${DRONE_STREAM_OUTPUT_DIR:./build/hls}
      public-base-url: ${DRONE_STREAM_PUBLIC_BASE_URL:http://localhost:8080/streams}
      startup-timeout-seconds: ${DRONE_STREAM_STARTUP_TIMEOUT:15}
      width: ${DRONE_STREAM_WIDTH:1280}
      height: ${DRONE_STREAM_HEIGHT:720}
      frame-rate: ${DRONE_STREAM_FRAME_RATE:30}
      segment-seconds: ${DRONE_STREAM_SEGMENT_SECONDS:1}
      playlist-size: ${DRONE_STREAM_PLAYLIST_SIZE:6}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-must-be-long-enough-for-hs256}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000
